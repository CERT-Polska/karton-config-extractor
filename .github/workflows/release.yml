name: Release a new version

on:
  release:
    types: [published]

jobs:
  release_pypi:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build package
      run: |
        pip3 install setuptools wheel
        python3 setup.py bdist_wheel
    - name: Publish to PyPi
      uses: pypa/gh-action-pypi-publish@v1.14.2
      with:
        user: __token__
        password: ${{ secrets.pypi_password }}
  release_dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.0
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push the image
        uses: docker/build-push-action@v7.4.0
        with:
          tags: |
            certpl/${{ github.event.repository.name }}:${{ github.sha }}
            certpl/${{ github.event.repository.name }}:${{ github.event.release.tag_name }}
            certpl/${{ github.event.repository.name }}:latest
          push: true
